<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b4d3f" />
    <title>Mercado+ — Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b4d3f; color: #102d26; font-family: Arial, sans-serif; }
      main { width: min(520px, 100%); padding: 42px; border-radius: 24px; background: #fffdf8; text-align: center; box-shadow: 0 24px 70px #001b164d; }
      .icon { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 20px; background: #f8d64e; color: #0b4d3f; font-size: 36px; font-weight: 800; }
      h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: 34px; }
      p { margin: 0 0 28px; color: #65716e; line-height: 1.6; }
      button { border: 0; border-radius: 12px; padding: 14px 24px; background: #f8d64e; color: #0b4d3f; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">!</div>
      <h1>Você está sem conexão</h1>
      <p>As vendas ficam pausadas até a internet voltar. Isso protege o estoque contra registros duplicados ou incompletos.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
